<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motomar · Login</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d11;--panel:#16161b;--line:#27272e;--ink:#f2f2f5;--muted:#9a9aa4;--red:#e8102e;--red-deep:#b80c22}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Archivo",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:16px}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px;text-align:center}
.card::before{content:"";display:block;width:42px;height:4px;border-radius:3px;background:var(--red);margin:0 auto 20px}
h1{font-stretch:118%;font-size:20px;font-weight:800;text-transform:uppercase;margin-bottom:10px}
p{color:var(--muted);font-size:13.5px;line-height:1.7;margin-bottom:24px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a{display:inline-flex;align-items:center;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:700;text-decoration:none}
.primary{background:var(--red);color:#fff}
.primary:hover{background:var(--red-deep)}
.secondary{border:1px solid var(--line);color:var(--ink)}
.secondary:hover{background:#1c1c22}
</style>
</head>
<body>
<main class="card">
    <h1>Login necessário</h1>
    <p>{{ mensagem }} A triagem de currículos usa a sua conta do Google para ler os e-mails.</p>
    <div class="actions">
        <a class="primary" href="/login-google?next=/curriculo">Entrar com Google</a>
        <a class="secondary" href="/">Voltar ao início</a>
    </div>
</main>
</body>
</html>
